version: "3"

services:

  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:latest
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  gateway:
    build: ./api-gateway
    ports:
      - "9000:9000"

  auth-service:
    build: ./auth-service
    ports:
      - "8001:8001"

  product-service:
    build: ./product-service
    ports:
      - "4000:4000"

  cart-service:
    build: ./cart-service
    ports:
      - "8002:8002"

  order-service:
    build: ./order-service
    ports:
      - "8003:8003"

  notification-service:
    build: ./notification-service
    ports:
      - "8004:8004"

  frontend:
    build: ./React_Frontend/mern_microservices
    ports:
      - "80:80"