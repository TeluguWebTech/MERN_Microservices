version: "3"

services:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0

    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

    ports:
      - "2181:2181"


  kafka:
    image: confluentinc/cp-kafka:7.5.0

    depends_on:
      - zookeeper

    ports:
      - "9092:9092"

    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1


  gateway:
    build: ./api-gateway

    ports:
      - "9000:9000"

    env_file:
      - ./api-gateway/.env


  auth-service:
    build: ./auth-service

    ports:
      - "8001:8001"

    env_file:
      - ./auth-service/.env


  product-service:
    build: ./product-service

    ports:
      - "4000:4000"

    env_file:
      - ./product-service/.env


  cart-service:
    build: ./cart-service

    ports:
      - "8002:8002"

    env_file:
      - ./cart-service/.env


  order-service:
    build: ./order-service

    depends_on:
      - kafka

    ports:
      - "8003:8003"
    
    env_file:
      - ./order-service/.env


  notification-service:
    build: ./notification-service

    depends_on:
      - kafka

    ports:
      - "8004:8004"


  frontend:
    build: ./React_Frontend/mern_microservices

    ports:
      - "80:80"